; Réglages QoQ-CoT (surchargent php.ini-production)
date.timezone = Europe/Paris
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off

; Cookie de session inaccessible au JavaScript et non envoyé par les autres sites
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Durcissement PHP2Shell (CVE-2026-109618 / CVE-2026-109619) : QoQ-CoT n'utilise pas la progression d'upload
session.upload_progress.enabled = 0
