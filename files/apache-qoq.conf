# Durcissement du site QoQ-CoT

ServerTokens Prod
ServerSignature Off

<Directory "/var/www/localhost/htdocs">
    Options -Indexes
</Directory>

# Bibliothèques, tests, configuration du coq et fichiers csv : utilisés côté serveur uniquement
<DirectoryMatch "^/var/www/localhost/htdocs/(lib|tests|config-coq|csv)(/|$)">
    Require all denied
</DirectoryMatch>

# Scripts inclus ou à lancer en ligne de commande, fichiers de configuration et de documentation
<FilesMatch "^(config|config_interne|checkRoles|layout|utils|setup|export_salles_to_csv|bonne_annee)\.php$|\.(dist|phar|txt|TXT)$|^\.qoq-build-id$">
    Require all denied
</FilesMatch>

<IfModule headers_module>
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</IfModule>
